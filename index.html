      <!-- ///////////////////////////////海浪////////////////////////////////////////   -->
      <div class="wave-container">
        <div class="wave wave-bottom"></div>

        <div class="wave wave-valley"></div>
        <!-- 新增谷型波浪 -->
      </div>
    </div>
    <!-- ///////////////////////////////////////////BAR////////////////////////////////////////////////// -->
    <nav id="navbar" class="nav">
      <ul>
        <li><a href="#">首頁</a></li>
        <li><a href="#">文壇扭蛋</a></li>

      </ul>
    </nav>
    <!-- ///////////////////////////////////////////section1扭蛋機////////////////////////////////////////////////// -->
    <div class="section1 fade-in">
      <div class="gatchaTextcontanier">
        <div class="gatchaText">
          <div><h2>文壇扭蛋驚喜</h2></div>
          <hr />
          <div>
            點擊「開始」按鈕，即刻啟動扭蛋體驗！每次抽取都會隨機選出一位作家，成為邀稿或演講合作的理想人選。讓你輕鬆找到具有獨特風格與深度的合作夥伴。
          </div>
          <hr />
          <div><button id="startButton">開始</button></div>
        </div>
      </div>

      <!-- 這張圖卡開始時隱藏 -->
      <div class="shiningCardContainerFlex">
        <div id="selectedCardContainer">
       
        </div>
        <div><button id="retryButton">再抽一次</button></div>
      </div>

      <!-- ///////////////////////////扭蛋機///////////////////////////////// -->
      <div class="gatchaImg">
        <img src="./img/gutcha.png" alt="扭蛋機" />
      </div>
    </div>
    <!-- ///////////////////////////////////////////section1////////////////////////////////////////////////// -->
    <svg
      width="100%"
      height="150px"
      viewBox="0 0 100 50"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
  </svg>
    <svg
      class="section2wave"
      width="100%"
      height="60px"
      viewBox="0 0 100 50"
      preserveAspectRatio="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M0,10 
               Q 25,45 50,35 
               Q 75,25 100,10 
               L100,50 
               L0,50 
               Z"
        fill="#000"
      />
    </svg>
<!-- ///////////////////////////////////////section2///////////////////////////////////////// -->
    <div class="section2 .fade-in ">

      <div class="section2Title"><h2>作家名冊</h2></div>
      <div class="section2cardlist"></div>
      <div class="grid-container" id="gridContainer">
       </div>  <!--Grid 容器-->
      
    </div>
